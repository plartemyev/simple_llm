# Serve simple_llm with Docker Compose — an alternative to
# scripts/run_server.sh (same images, same SLM_* configuration variables).
#
#   docker compose up -d cuda      # CUDA backend (simple_llm:cuda image)
#   docker compose up -d vulkan-nvidia # Vulkan backend, NVIDIA host
#   docker compose up -d vulkan-amd # Vulkan backend, AMD host (/dev/dri + in-image RADV)
#   docker compose up -d embedder  # text embedder (CPU) on 127.0.0.1:8012
#   docker compose up -d embedder-amd # text embedder on the AMD GPU
#   docker compose logs -f cuda
#   docker compose down cuda       # teardown needs the service name (or
#                                  # --profile): plain `down` is a no-op here
#                                  # because every service has a profile
#
# Images are built automatically when missing, or ahead of time with
# scripts/build_image.sh / docker compose build.
#
# Containers run as the invoking host user (SLM_UID / SLM_GID override the
# 1000 defaults) so bind-mount writes under ./data stay user-owned.
#
# Configuration comes from the host environment; SLM_MODEL is required:
#
#   SLM_MODEL=ornith-ai/Ornith-1.5-9B-GGUF:Q8_0 docker compose up -d cuda
#
# or put SLM_MODEL=... into a .env file next to this compose.yaml (loaded
# automatically for every docker compose subcommand — with the required-var
# check above, even `down`/`logs` need the variable when set inline).
# llama-server tuning env vars (README "MoE offload / tensor placement",
# "KV cache quantization") pass through from the host when set and apply to
# both backends:
#
#   LLAMA_ARG_CPU_MOE=1 docker compose up -d vulkan-nvidia
#   LLAMA_ARG_OVERRIDE_TENSOR='exps=CPU' docker compose up -d cuda
#   SLM_KV_QUANT=q8_0 docker compose up -d cuda   # quantized KV (-fa on -ctk/-ctv q8_0)
#
# GPU-side -ot buffer names are backend-specific: CUDA0, CUDA1, ... under
# CUDA; Vulkan0, Vulkan1, ... under Vulkan (exps=CPU is universal; exact
# match — a wrong name fails the load listing the accepted names).

x-env: &env
  SLM_MODEL: ${SLM_MODEL:?set SLM_MODEL to an HF id (repo:quant) or a /models/*.gguf name}
  SLM_CTX_SIZE: ${SLM_CTX_SIZE:-8192}
  SLM_PARALLEL: ${SLM_PARALLEL:-4}
  SLM_KV_QUANT:
  SLM_MMPROJ:
  SLM_EXTRA_ARGS:
  LLAMA_ARG_CPU_MOE:
  LLAMA_ARG_N_CPU_MOE:
  LLAMA_ARG_OVERRIDE_TENSOR:

x-common: &common
  restart: unless-stopped
  ipc: host
  user: "${SLM_UID:-1000}:${SLM_GID:-1000}"
  ports:
    - "127.0.0.1:${SLM_PORT:-8011}:8011"
  volumes:
    - ./data/models:/models
    - ./data/cache:/data/cache
  env_file:
    - path: secrets.env
      required: false # optional; git-ignored; forwarded wholesale into the
                      # container — HF_TOKEN for gated repos, plus anything
                      # else this environment block does not declare (e.g.
                      # other LLAMA_ARG_* tuning vars)

services:
  cuda:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile.cuda
    image: simple_llm:cuda
    profiles: [cuda]
    environment:
      <<: *env
      CUDA_VISIBLE_DEVICES: ${SLM_GPU:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vulkan-nvidia:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile.vulkan
    image: simple_llm:vulkan
    profiles: [vulkan-nvidia]
    environment:
      <<: *env
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
      GGML_VK_VISIBLE_DEVICES:
    # If the host's NVIDIA ICD json is not picked up automatically, append it
    # to volumes (see README "Vulkan"):
    #   - /usr/share/vulkan/icd.d/nvidia_icd.json:/usr/share/vulkan/icd.d/nvidia_icd.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Same simple_llm:vulkan image (ships Mesa's RADV); wires /dev/dri render
  # nodes instead of the NVIDIA toolkit. GPU selection via
  # GGML_VK_VISIBLE_DEVICES (README "Vulkan").
  vulkan-amd:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile.vulkan
    image: simple_llm:vulkan
    profiles: [vulkan-amd]
    devices:
      - /dev/dri:/dev/dri
    # Hosts with group-restricted render nodes (e.g. 0660 root:render, common
    # on Debian-family hosts) must give the container user the owning group:
    # group_add:
    #   - 992  # host gid: stat -c %g /dev/dri/renderD128
    environment:
      <<: *env
      GGML_VK_VISIBLE_DEVICES:

  # Text embedder (README "Embeddings"): bge-m3, 1024-dim dense vectors via
  # the OpenAI-compatible /v1/embeddings endpoint. Host port 8012; the
  # container-side port stays at the entrypoint's 8011 default (SLM_PORT is
  # the *listen* port inside the container — never change it per service).
  # CLS pooling is what bge-m3's dense embeddings were trained with (and
  # what the GGUF metadata carries — the flag documents it). -ub 8192
  # prefills an entire input in one ubatch: embeddings are bidirectional,
  # so an input split across ubatches cannot attend past the chunk edge.
  # SLM_PARALLEL=1 keeps the full 8192-token context for a single input.
  #
  # This variant runs on CPU (SLM_GPU_LAYERS=0): a 568M prefill-only
  # encoder needs no GPU, leaving all VRAM to the chat model. Bulk
  # indexing is CPU-bound; queries are still sub-second.
  embedder:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile.vulkan
    image: simple_llm:vulkan
    profiles: [embedder]
    ports:
      - "127.0.0.1:8012:8011"
    environment:
      SLM_MODEL: ggml-org/bge-m3-Q8_0-GGUF
      SLM_GPU_LAYERS: 0
      SLM_CTX_SIZE: 8192
      SLM_PARALLEL: 1
      SLM_EXTRA_ARGS: --embeddings --pooling cls -ub 8192

  # Same embedder on the AMD GPU (/dev/dri + in-image RADV, see
  # vulkan-amd): takes ~0.8 GiB VRAM (0.6 GiB Q8_0 weights plus prefill
  # buffers) — on the 8 GB reference deployment running the chat model,
  # prefer the CPU embedder above.
  embedder-amd:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile.vulkan
    image: simple_llm:vulkan
    profiles: [embedder-amd]
    devices:
      - /dev/dri:/dev/dri
    # group_add:
    #   - 992  # host gid for 0660 render nodes: stat -c %g /dev/dri/renderD128
    ports:
      - "127.0.0.1:8012:8011"
    environment:
      SLM_MODEL: ggml-org/bge-m3-Q8_0-GGUF
      SLM_CTX_SIZE: 8192
      SLM_PARALLEL: 1
      SLM_EXTRA_ARGS: --embeddings --pooling cls -ub 8192
      GGML_VK_VISIBLE_DEVICES:
